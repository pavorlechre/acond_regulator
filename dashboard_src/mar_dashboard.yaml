- type: sections
  title: Export statistiky
  path: statistika_export
  icon: mdi:image-outline
  max_columns: 1
  subview: true
  back_path: /dashboard-pokus2/statistika
  sections:
  - type: grid
    cards:
    - type: markdown
      content: '### Snímek pro sdílení


        **1.** Vyrob snímek. **2.** Otevři ho v prohlížeči. **3.** Tam nad ním klepni pravým tlačítkem (na mobilu podrž prst) a dej **Uložit obrázek** — pak ho přiložíš do skupiny jako každou fotku.


        Ten druhý krok musí být, protože přímo tady v Home Assistantu systémové menu nevyskočí ani na počítači, ani na tabletu. Snímek se ukládá i na disk do `config/www/mar/`, takže se k němu dostaneš
        i přes sdílenou složku.


        Snímek vzniká až na stisk a čísla bere v ten okamžik, takže nemůže být zastaralý. Čas pořízení i rozsah dat jsou přímo v obrázku.

        '
    - type: button
      name: 1 · Vyrobit snímek
      icon: mdi:camera-outline
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.mar_statistika_obnovit
    - type: markdown
      content: '### 2 · Otevřít snímek


        <a href="{{ state_attr(''image.mar_statistika'',''snimek_url'') or ''/local/mar/statistika.png'' }}" target="_blank" rel="noreferrer">Otevřít snímek v prohlížeči</a>


        Kdyby odkaz nefungoval, adresa ke zkopírování je: `{{ state_attr(''image.mar_statistika'',''snimek_url'') or ''/local/mar/statistika.png'' }}`'
    - type: button
      name: Otevřít snímek — záloha
      icon: mdi:open-in-new
      tap_action:
        action: url
        url_path: /local/mar/statistika.png
    - type: picture-entity
      entity: image.mar_statistika
      show_state: false
      show_name: false
      tap_action:
        action: more-info
    - type: markdown
      content: '### Statistika po dnech


        Dnešek a sedm zavřených dnů vedle sebe — na porovnání s jinou instalací. V součtu za týden se ztratí, že jeden den bylo pět startů a druhý dvacet.


        Osm sloupců se na displej nevejde, takže je to **jen soubor ke stažení**, ne obrázek na dashboardu.

        '
    - type: button
      name: 1 · Vyrobit rozpad po dnech
      icon: mdi:table-large
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.mar_statistika_po_dnech
    - type: markdown
