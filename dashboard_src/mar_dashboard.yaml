- title: Profily
  path: profily
  icon: mdi:content-save-cog-outline
  max_columns: 2
  subview: true
  back_path: /dashboard-pokus2/regulace
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: horizontal-stack
      cards:
      - type: button
        name: Ekviterma
        icon: mdi:chart-bell-curve-cumulative
        tap_action:
          action: navigate
          navigation_path: /dashboard-pokus2/regulace
      - type: button
        name: ● Profily
        icon: mdi:content-save-cog-outline
        tap_action:
          action: none
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      content: '### Profily nastavení

        Pojmenovaná sada čísel: **ekvitermní křivka, koeficient korekce a okna průměrování**, volitelně plus **ladění FVE** (prahy, SoC, návnady).


        Co v profilu **není**: režimy (Den/noc, Zebra, Okna, Dovolená), zapojení (entity_id střídače, znaménko baterie), mastery programů a bezpečnostní stropy. Ty jsou vázané na konkrétní dům, ne na náladu
        regulace.


        Profily leží v `config/mar_profily/` jako soubory `.csv` — dají se poslat mailem nebo do skupiny.'
  - type: grid
    cards:
    - type: entities
      title: Uložit nastavení
      entities:
      - entity: text.mar_profil_nazev
        name: Jméno profilu
      - entity: switch.mar_profil_ulozit_fve
        name: Uložit včetně FVE
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.mar_profil_kolize
        state: 'off'
      card:
        type: tile
        entity: button.mar_profil_ulozit
        name: Uložit
        icon: mdi:content-save-outline
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mar_profil_ulozit
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.mar_profil_kolize
        state: 'on'
      card:
        type: vertical-stack
        cards:
        - type: markdown
          content: ⚠️ **Profil `{{ states('text.mar_profil_nazev') }}` už existuje.** Uložení pod tímto jménem přepíše jeho obsah.
        - type: tile
          entity: button.mar_profil_prepsat
          name: Přepsat existující
          icon: mdi:content-save-alert-outline
          tap_action:
            action: perform-action
            perform_action: button.press
            target:
              entity_id: button.mar_profil_prepsat
            confirmation:
              text: Opravdu přepsat profil? Původní obsah se nedá vrátit.
  - type: grid
    cards:
    - type: entities
      title: Načíst nastavení
      entities:
      - entity: select.mar_profil
        name: Profil
      - entity: switch.mar_profil_nacist_fve
        name: Načíst včetně FVE
    - type: tile
      entity: button.mar_profil_obnovit_seznam
      name: Obnovit seznam
      icon: mdi:folder-refresh-outline
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.mar_profil_obnovit_seznam
    - type: tile
      entity: button.mar_profil_nacist
      name: Načíst
      icon: mdi:tray-arrow-down
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.mar_profil_nacist
        confirmation:
          text: Načíst profil? Přepíše se současné nastavení ekvitermy (a FVE, je-li přepínač zapnutý).
    - type: tile
      entity: button.mar_profil_smazat
      name: Smazat vybraný
      icon: mdi:trash-can-outline
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.mar_profil_smazat
        confirmation:
          text: Opravdu smazat vybraný profil?
    - type: markdown
      content: 'Sady označené **[vzor]** jsou předpřipravené výchozí body podle typu domu. Jsou jen ke čtení — nedají se přepsat ani smazat.


        Vzor je **výchozí bod, ne doporučení**: začíná schválně spíš pod cílem. Nízká křivka je nepohodlí, které do dne poznáš a dorovnáš; vysoká tiše platí peníze měsíce. Radiátorový vzor je navíc čistý
        výpočet — ověřené instalace jsou obě podlahové.'
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      content: '{% set s = ''sensor.mar_profil_stav'' %}

        {% set odkaz = state_attr(s, ''odkaz'') %}

        **Poslední operace:** {{ states(s) }}

        {% if odkaz %}


        <a href="{{ odkaz }}" target="_blank">⬇️ Stáhnout uložený profil do zařízení</a>

        {% endif %}

        {% set v = state_attr(s, ''varovani'') %}

        {% if v %}


        Zahozené řádky:

        {% for r in v %}

        - {{ r }}

        {% endfor %}

        {% endif %}


        ---

        Hledá se v `{{ state_attr(s, ''adresar'') }}` — nalezeno **{{ state_attr(s, ''profilu'') }}** profilů a **{{ state_attr(s, ''vzoru'') }}** vzorů. Soubor musí mít příponu `{{ state_attr(s, ''pripona'')
        }}`; ručně nakopírovaný se v seznamu objeví do půl minuty (nebo hned po „Obnovit seznam").


        Při uložení se použije **{{ ''včetně FVE'' if state_attr(s, ''ulozit_s_fve'') else ''jen ekviterma'' }}**, při načtení **{{ ''včetně FVE'' if state_attr(s, ''nacist_s_fve'') else ''jen ekviterma''
        }}**.

        {% if state_attr(s, ''chyba_cesty'') %}


        ⚠️ {{ state_attr(s, ''chyba_cesty'') }}

        {% endif %}'
