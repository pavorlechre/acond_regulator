title: Regulace MaR
views:
- type: sections
  title: Režimy
  path: rezimy
  icon: mdi:tune-variant
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: horizontal-stack
      cards:
      - type: button
        name: ● Režimy
        icon: mdi:tune-variant
        tap_action:
          action: none
      - type: button
        name: Ekviterma
        icon: mdi:chart-bell-curve-cumulative
        tap_action:
          action: navigate
          navigation_path: /dashboard-pokus2/regulace
      - type: button
        name: Schéma
        icon: mdi:sitemap-outline
        tap_action:
          action: navigate
          navigation_path: /dashboard-pokus2/schema
  - type: grid
    column_span: 2
    cards:
    - type: horizontal-stack
      cards:
      - type: tile
        entity: button.mar_zapnout_jiste
        name: Topit
        icon: mdi:play-circle-outline
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mar_zapnout_jiste
          confirmation:
            text: Opravdu spustit topení (Topit)?
      - type: tile
        entity: button.mar_vypnout_setrne
        name: Netopit
        icon: mdi:stop-circle-outline
        tap_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.mar_vypnout_setrne
          confirmation:
            text: Opravdu přejít do klidu (Netopit)?
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      content: "{% set e = 'sensor.mar_stav' %}\n{% set stav = state_attr(e, 'stav_zeleza') -%}\n{%- set bezi = is_state('binary_sensor.acond_30045_hp_comp_bit_0', 'on') -%}\n{#- otáčky: stupeň se odvozuje\
        \ z rozsahu konkrétního stroje (min/max slideru) -#}\n{%- set rpm = states('sensor.acond_30024_comp_rpm_actual') | float(0) -%}\n{%- set lo = state_attr('number.acond_40014_comp_capacity_max_set',\
        \ 'min') | float(1500) -%}\n{%- set hi = state_attr('number.acond_40014_comp_capacity_max_set', 'max') | float(6000) -%}\n{%- set t3 = (hi - lo) / 3 -%}\n{%- set stupen = 1 if rpm < lo + t3 else\
        \ (2 if rpm < lo + 2 * t3 else 3) -%}\n{#- teplotní pásmo: krajní body ekvitermní křivky, tedy měřítko tohoto domu -#}\n{%- set tv = states('sensor.acond_30018_t_act_water_outlet') | float(0) -%}\n\
        {%- set dolni = states('number.mar_bod_p15') | float(25) -%}\n{%- set horni = states('number.mar_bod_m15') | float(45) -%}\n{%- set krok = (horni - dolni) / 3 -%}\n{%- set pasmo = 'a' if tv < dolni\
        \ else ('b' if tv < dolni + krok\n      else ('c' if tv < dolni + 2 * krok else ('d' if tv < horni else 'e'))) -%}\n{#- klid: nápis podle zvoleného režimu, barva podle sezóny -#}\n{%- set leto =\
        \ is_state('binary_sensor.acond_30007_tc_status_bit_10', 'on') -%}\n{%- set rez = 'vyp' if is_state('switch.acond_40006_tc_set_bit_3', 'on')\n      else ('chl' if is_state('switch.acond_40006_tc_set_bit_4',\
        \ 'on')\n      else ('biv' if is_state('switch.acond_40006_tc_set_bit_2', 'on')\n      else ('tc' if is_state('switch.acond_40006_tc_set_bit_1', 'on') else 'aut'))) -%}\n{#- pořadí stavů je stejné\
        \ jako ve statistice, aby obrázek nelhal proti číslům -#}\n{%- set obr = 'odmrazovani' if stav == 'odmrazování'\n      else ('chlazeni' if stav == 'chlazení'\n      else ('tuv-' ~ stupen ~ pasmo\
        \ if stav == 'ohřev TUV'\n      else ('topeni-' ~ stupen ~ pasmo if bezi\n      else ('klid-porucha' if is_state('binary_sensor.acond_30007_tc_status_bit_2', 'on')\n      else ('klid-chl-z' if rez\
        \ == 'chl'\n      else 'klid-' ~ rez ~ ('-l' if leto else '-z')))))) %}\n\n| <h3>Stav regulace</h3> | &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;\
        \ |\n|---|---:|\n| **{{ state_attr(e, 'strategie') }}** — {{ state_attr(e, 'veta') | replace('|', '/') }} | <img src=\"/mar-kompresor/{{ obr }}.svg\" width=\"124\"> |\n\n{% set banner = state_attr(e,\
        \ 'stav_zeleza') %}\n{% set topi = state_attr(e, 'topi') %}\n{% set reg = state_attr(e, 'reguluje') %}\n{% set duvod = state_attr(e, 'duvod') %}\n{% set aktiv = state_attr(e, 'faze_aktivni') %}\n\
        {% set faze = state_attr(e, 'faze') %}\n{% if reg %}\n> ✍️ **Zápis zpátečky – zapisuje**\n{% elif reg is none %}\n> ✍️ **Zápis zpátečky:** stav ještě neznám (MaR se načítá)\n{% else %}\n> ✍️ **Ekviterma\
        \ – nezapisuje** — {{ duvod if duvod else 'vede FVE topení, na registru je návnada' }}\n{% endif %}\n{% if aktiv %}\n> ⏳ **Probíhá {{ 'zapínání' if aktiv == 'start' else 'vypínání' }}:** {{ faze\
        \ }}\n{% elif banner %}\n> ℹ️ **{{ banner }}** — kompresor běží, netopí dům.\n{% endif %}\n{% set z = state_attr(e, 'zebra') %}\n{% if z and z.aktivni %}\n{% set ra = states('sensor.acond_30002_t_act_indoor1')\
        \ | float(0) %}\n{% set rs = states('number.acond_40001_t_set_indoor1') | float(0) %}\n{% set konec = z.konec_faze %}\n{% set zbyva = (((as_timestamp(konec) - as_timestamp(now())) / 60) | round(0))\
        \ if konec else '?' %}\n> \U0001F993 **Zebra:** {{ z.faze or '—' }} · konec fáze za **{{ zbyva }} min** · startů dnes: {{ z.starty_dnes }}\n>\n{% if z.faze == 'pauza' %}> Po pauze → **vždy Zapnout\
        \ jistě** (topí dál nezávisle na termostatu)\n{% else %}> Pokoj {{ ra }} °C / žádá {{ rs }} °C → {{ 'natopeno → po intervalu pauza' if ra > rs else 'nenatopeno → topí dál (pauza až když pokoj > žádá)'\
        \ }}\n{% endif %}              {% endif %}\n{% set dn = state_attr(e, 'dennoc') %}\n{% if dn and dn.aktivni %}\n{% set zmena = dn.pristi_zmena %}\n{% set zm = (zmena | as_datetime | as_local).strftime('%H:%M')\
        \ if zmena else '—' %}\n> \U0001F317 **Den/noc:** {{ 'v okně → topí se dle strategie' if dn.uvnitr_okna else 'mimo okno → TČ vypnuté (protizámraz jede)' }} · platných oken: {{ dn.oken_platnych }}\
        \ · příští změna v **{{ zm }}**\n{% endif %}\n{% set ot = state_attr(e, 'okna_teploty') %}\n{% if ot and ot.aktivni %}\n{% set ozm = ot.pristi_zmena %}\n{% set ozm2 = (ozm | as_datetime | as_local).strftime('%H:%M')\
        \ if ozm else '—' %}\n{% if ot.aktivni_okno %}\n> \U0001F321️ **Okna +/− teploty:** okno {{ ot.aktivni_okno }} běží → posun **{{ '%+.1f' | format(ot.delta) }} °C** (z {{ ot.base }} °C) · vrátím\
        \ v **{{ ozm2 }}**\n{% else %}\n> \U0001F321️ **Okna +/− teploty:** mimo okno · platných oken: {{ ot.oken_platnych }} · příští v **{{ ozm2 }}**\n{% endif %}\n{% endif %}\n{% set dv = state_attr(e,\
        \ 'dovolena') %}\n{% if dv and dv.aktivni %}\n{% set dod = (dv.od | as_datetime | as_local).strftime('%-d. %-m. %H:%M') if dv.od else '—' %}\n{% set ddo = (dv.do | as_datetime | as_local).strftime('%-d.\
        \ %-m. %H:%M') if dv.do else '—' %}\n{% if dv.probiha %}\n> \U0001F3D6️ **Dovolená běží:** místnost **{{ dv.cil_mistnost }} °C**, TUV **{{ dv.cil_tuv }} °C** · vrátím {{ ddo }} (na {{ dv.base_mistnost\
        \ }} / {{ dv.base_tuv }} °C)\n{% else %}\n> \U0001F3D6️ **Dovolená:** naplánováno {{ dod }} → {{ ddo }} (místnost {{ dv.cil_mistnost }} °C, TUV {{ dv.cil_tuv }} °C)\n{% endif %}\n{% endif %}\n{%-\
        \ set e = 'sensor.mar_stav' -%}\n{#- desetinná čárka a pomlčka místo „unknown\" na jednom místě -#}\n{%- macro c(v, jed='', des=1) -%}\n{%- if v is none or v in ['unknown', 'unavailable', ''] -%}–{%-\
        \ else -%}{{ ('%.' ~ des ~ 'f') | format(v | float(0)) | replace('.', ',') }}{{ ' ' ~ jed if jed else '' }}{%- endif -%}\n{%- endmacro -%}\n{%- set tv = states('sensor.acond_30018_t_act_water_outlet')\
        \ | float(0) -%}\n{%- set zp = states('sensor.acond_30009_t_act_water_back') | float(0) -%}\n{%- set delta = tv - zp -%}\n\n\n| | | | |\n|---|--:|---|--:|\n| Zpátečka | {{ c(states('sensor.acond_30009_t_act_water_back'),\
        \ '°C', 1) }} | Topná voda | {{ c(states('sensor.acond_30018_t_act_water_outlet'), '°C', 1) }} |\n| Žádaná zpátečka | {{ c(state_attr(e, 'zpatecka_cil'), '°C') }} | Zapsaná | {{ c(state_attr(e,\
        \ 'zpatecka_na_registru'), '°C') }} |\n| Z křivky | {{ c(state_attr(e, 'zpatecka_z_krivky'), '°C') }} | Korekce | {{ c(state_attr(e, 'korekce'), '°C') }} |\n| Vnitřní | {{ c(states('sensor.acond_30002_t_act_indoor1'),\
        \ '°C', 1) }} | Žádaná | {{ c(states('number.acond_40001_t_set_indoor1'), '°C', 1) }} |\n| Venkovní | {{ c(states('sensor.acond_30010_t_act_air'), '°C', 1) }} | Modelová | {{ c(state_attr(e, 'model_teplota'),\
        \ '°C') }} |\n| TUV | {{ c(states('sensor.acond_30006_t_act_tuv'), '°C', 1) }} | Žádaná | {{ c(states('number.acond_40005_t_set_tuv'), '°C', 1) }} |\n| Otáčky | {{ c(states('sensor.acond_30024_comp_rpm_actual'),\
        \ 'rpm', 0) }} | Limit | {{ c(states('number.acond_40014_comp_capacity_max_set'), 'rpm', 0) }} |\n| Spotřeba | {{ c(states('sensor.acond_30027_aep'), 'W', 0) }} | Výkon | {{ c(states('sensor.acond_30028_ahp'),\
        \ 'W', 0) }} |\n| COP | {{ c(states('sensor.acond_30029_cop'), '', 2) }} | Rozdíl T | {{ c(delta, 'K') }} |\n"
    - type: history-graph
      title: Co dělá MaR (−12 h)
      hours_to_show: 12
      entities:
      - entity: select.mar_strategie
        name: Strategie
      - entity: switch.mar_zebra
        name: Zebra
      - entity: switch.mar_dennoc
        name: Den/noc
      - entity: sensor.mar_stav
        name: Stav
      - entity: binary_sensor.acond_30045_hp_comp_bit_0
        name: Kompresor
