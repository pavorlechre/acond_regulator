- type: sections
  title: Nastavení
  path: nastaveni
  icon: mdi:cog-outline
  max_columns: 2
  subview: true
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      content: '## Teploty a výkon'
    - type: tile
      entity: number.acond_40001_t_set_indoor1
      name: Okruh 1 – zadání
      icon: mdi:home-thermometer
      vertical: false
      features_position: bottom
      features:
      - type: numeric-input
        style: buttons
    - type: tile
      entity: number.acond_40005_t_set_tuv
      name: TUV – zadání
      icon: mdi:water-thermometer
      vertical: false
      features_position: bottom
      features:
      - type: numeric-input
        style: buttons
    - type: tile
      entity: number.acond_40014_comp_capacity_max_set
      name: Nast. otáček
      icon: mdi:speedometer
      vertical: false
      features_position: bottom
      features:
      - type: numeric-input
        style: slider
      grid_options:
        columns: 9
    - type: button
      name: Příručka
      show_name: true
      icon: mdi:help-circle-outline
      tap_action:
        action: url
        url_path: /mar-prirucka/index.html
      grid_options:
        columns: 3
        rows: 2
    - type: markdown
      content: Ekvitermu (křivku, korekci na místnost, okna průměrování a Profily)
        nastavíš v okně **Ekviterma**.
  - type: grid
    cards:
    - type: markdown
      content: '## Zebra'
    - type: entities
      entities:
      - entity: number.mar_zebra_topeni
        name: Interval topení (min)
        icon: mdi:fire
      - entity: number.mar_zebra_pauza
        name: Interval pauzy (min)
        icon: mdi:pause-circle-outline
    - type: markdown
      content: '## Den/noc'
    - type: entities
      title: Okno 1
      entities:
      - entity: time.mar_dennoc_okno_1_od
        name: Od
      - entity: time.mar_dennoc_okno_1_do
        name: Do
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.mar_dennoc_okno_1_nastaveno
        state: 'on'
      card:
        type: entities
        title: Okno 2
        entities:
        - entity: time.mar_dennoc_okno_2_od
          name: Od
        - entity: time.mar_dennoc_okno_2_do
          name: Do
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.mar_dennoc_okno_2_nastaveno
        state: 'on'
      card:
        type: entities
        title: Okno 3
        entities:
        - entity: time.mar_dennoc_okno_3_od
          name: Od
        - entity: time.mar_dennoc_okno_3_do
          name: Do
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.mar_dennoc_okno_3_nastaveno
        state: 'on'
      card:
        type: entities
        title: Okno 4
        entities:
        - entity: time.mar_dennoc_okno_4_od
          name: Od
        - entity: time.mar_dennoc_okno_4_do
          name: Do
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.mar_dennoc_okno_4_nastaveno
        state: 'on'
      card:
        type: entities
        title: Okno 5
        entities:
        - entity: time.mar_dennoc_okno_5_od
          name: Od
        - entity: time.mar_dennoc_okno_5_do
          name: Do
  - type: grid
    cards:
    - type: markdown
      content: '## Okna +/− teploty'
    - type: entities
      title: Okno 1
      entities:
      - entity: time.mar_okna_teploty_1_od
        name: Od
      - entity: time.mar_okna_teploty_1_do
        name: Do
      - entity: number.mar_okna_teploty_1_delta
        name: Změna teploty (°C)
        icon: mdi:thermometer-plus
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.mar_okna_teploty_1_nastaveno
        state: 'on'
      card:
        type: entities
        title: Okno 2
        entities:
        - entity: time.mar_okna_teploty_2_od
          name: Od
        - entity: time.mar_okna_teploty_2_do
          name: Do
        - entity: number.mar_okna_teploty_2_delta
          name: Změna teploty (°C)
          icon: mdi:thermometer-plus
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.mar_okna_teploty_2_nastaveno
        state: 'on'
      card:
        type: entities
        title: Okno 3
        entities:
        - entity: time.mar_okna_teploty_3_od
          name: Od
        - entity: time.mar_okna_teploty_3_do
          name: Do
        - entity: number.mar_okna_teploty_3_delta
          name: Změna teploty (°C)
          icon: mdi:thermometer-plus
    - type: markdown
      content: '## Dovolená'
    - type: conditional
      conditions:
      - condition: state
        entity: switch.mar_dovolena
        state: 'on'
      card:
        type: markdown
        content: '⚠️ **Dovolená běží.** Po dobu intervalu jsou Okna +/− teploty a
          změna strategie zablokované. Interval a cíle měň jen s vypnutou dovolenou.

          '
    - type: entities
      title: Dovolená – interval a cíle (nastav před zapnutím)
      entities:
      - entity: datetime.mar_dovolena_od
        name: Od
      - entity: datetime.mar_dovolena_do
        name: Do
      - entity: number.mar_dovolena_teplota
        name: Teplota místnosti (°C)
        icon: mdi:home-thermometer
      - entity: number.mar_dovolena_tuv
        name: Teplota TUV (°C)
        icon: mdi:water-thermometer
  - type: grid
    cards:
    - type: markdown
      content: '## FVE TUV'
    - type: entities
      title: Nastavení ohřevu z přebytku
      entities:
      - entity: number.mar_fve_tuv_start
        name: Zapnout při přebytku nad (W)
        icon: mdi:play-circle-outline
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.mar_fve_baterie
        state:
        - unavailable
        - unknown
      card:
        type: entities
        entities:
        - entity: number.mar_fve_tuv_stop
          name: Vypnout při přebytku pod (W)
          icon: mdi:stop-circle-outline
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.mar_fve_baterie
        state_not:
        - unavailable
        - unknown
      card:
        type: entities
        title: S baterií
        entities:
        - entity: number.mar_fve_tuv_baterie_prah
          name: Vypnout, až baterie klesne pod (%)
          icon: mdi:battery-charging-high
        - entity: number.mar_fve_tuv_baterie_pokles
          name: … a zároveň klesne aspoň o (%)
          icon: mdi:battery-minus-variant
  - type: grid
    cards:
    - type: markdown
      content: '## FVE topení'
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.mar_fve_baterie
        state_not:
        - unavailable
        - unknown
      card:
        type: entities
        title: Držení SoC (s baterií)
        entities:
        - entity: number.mar_topeni_soc_hranice
          name: Hranice — drž SoC kolem (%)
          icon: mdi:battery-heart-variant
        - entity: number.mar_topeni_soc_dolni_mez
          name: Předej ekvitermě pod (%)
          icon: mdi:battery-low
        - entity: number.mar_topeni_tah
          name: Tah k hranici (W na %)
          icon: mdi:arrow-collapse-down
        - entity: number.mar_topeni_okno
          name: Okno průměru bilance (min)
          icon: mdi:timer-sand
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.mar_fve_baterie
        state:
        - unavailable
        - unknown
      card:
        type: entities
        title: Přebytek (bez baterie)
        entities:
        - entity: number.mar_topeni_stop
          name: Vytrvalost — drž přetok nad (W)
          icon: mdi:stop-circle-outline
        - entity: number.mar_topeni_start
          name: Hojnost — převezmi běžící stroj nad (W)
          icon: mdi:play-circle-outline
        - entity: number.mar_topeni_start_studeny
          name: Rozjezd stojícího stroje nad (W)
          icon: mdi:engine-outline
        - entity: number.mar_topeni_prodleva
          name: Na minimu vydrž (min)
          icon: mdi:timer-sand
        - entity: number.mar_topeni_blok
          name: Blok zápisů směrem nahoru (min)
          icon: mdi:content-save-cog-outline
        - entity: number.mar_topeni_okno
          name: Okno průměru bilance (min)
          icon: mdi:chart-bell-curve
    - type: entities
      title: Návnady a stropy
      entities:
      - entity: number.mar_topeni_navnada
        name: Návnada zpátečky — nad ekvitermu (°C)
        icon: mdi:fishing
      - entity: number.mar_topeni_navnada_pokojovka
        name: Návnada pokojovkou — nad požadovanou (°C)
        icon: mdi:home-thermometer-outline
      - entity: number.mar_topeni_strop_zpatecka
        name: Nejvyšší zpátečka — podlaha (°C)
        icon: mdi:pipe
      - entity: number.mar_topeni_strop_mistnost
        name: Strop místnosti — tvrdý stop (°C)
        icon: mdi:home-thermometer
      - entity: number.mar_topeni_cidlo_timeout
        name: Ztráta čidla — konec po (min)
        icon: mdi:timer-alert-outline
      - entity: switch.mar_topeni_hlidac
        name: Hlídač restartu po předání
        icon: mdi:restart-alert
  - type: grid
    column_span: 2
    cards:
    - type: markdown
      content: Programy se zapínají tlačítky na schématu. Tady se dají nastavit předem,
        i když zrovna neběží.
