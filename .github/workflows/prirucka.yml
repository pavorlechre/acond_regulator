name: Příručka na web

# Vystaví příručku na GitHub Pages: https://pavorlechre.github.io/acond_regulator/
# Zdroj je jediný: custom_components/acond_regulator/prirucka/ (tentýž soubor,
# který HA servíruje na /mar-prirucka/). Nic se nekopíruje do repa.
# Jednorázově: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches:
      - dev
    paths:
      - "custom_components/acond_regulator/prirucka/**"
      - ".github/workflows/prirucka.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: custom_components/acond_regulator/prirucka
      - id: deployment
        uses: actions/deploy-pages@v4
